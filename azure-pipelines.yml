trigger:
- main

pool: axion-pool

stages:
  - stage: 
    displayName: build 
    jobs:
      - job: Build
        displayName: Build
        steps:
        - task: Docker@2
          inputs:
            containerRegistry: 'axion-container-connection'
            repository: 'container12'
            command: 'build'
            Dockerfile: '**/Dockerfile'
      - job: Trivy 
        displayName: Trivy 
        steps:
        - task: PowerShell@2
          inputs:
            targetType: 'inline'
            script: 'trivy image --severity HIGH,CRITICAL --exit-code 1 container12.azurecr.io/axion-ui: latest'