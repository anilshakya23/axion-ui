  - stage: SAST
    displayName: Static Application Security Testing
    jobs:
      - job: SonarQubeSAST
        displayName: SonarQube code covrage
        steps:
        - task: SonarQubePrepare@8
          displayName: 'Prepare SonarQube Analysis'
          inputs:
            SonarQube: 'sonar-service-connection'
            scannerMode: 'cli'
            configMode: 'manual'
            cliProjectKey: 'sonarqubeserver'
            cliProjectName: 'sonarqubeserver'
            cliSources: '.'
            
